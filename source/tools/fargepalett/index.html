<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="../../images/app-multi.ico" />
  <title>Fargepalett-verktøy</title>
  <style>
    :root {
      --brand-green: #009d4f;
      --brand-deep-green: #005850;
      --brand-light: #cfd2d3;
      --surface: rgba(255, 255, 255, 0.94);
      --text: #12332f;
      --muted: #385552;
      --border: #afbbbb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Calibri, sans-serif;
      color: var(--text);
      background: linear-gradient(140deg, #edf6f1, #cfd2d3);
      padding: 20px;
    }
    .wrap { width: min(1200px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 12px; }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
    .panel, .preview {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .panel { display: grid; gap: 10px; align-content: start; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type="text"], input[type="color"], select, button {
      width: 100%;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      background: #fff;
      color: var(--text);
    }
    input[type="color"] { height: 44px; padding: 4px; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { cursor: pointer; font-weight: 700; }
    #copyBtn { background: var(--brand-green); color: #fff; border-color: transparent; }
    section.block + section.block { margin-top: 18px; }
    h2 { font-size: 1.1rem; margin: 0 0 10px; }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .swatch {
      display: grid;
      gap: 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font: inherit;
    }
    .swatch .fill { height: 56px; }
    .swatch .label { padding: 6px 8px; font-size: 0.78rem; color: var(--muted); }
    .contrast-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .contrast-preview {
      border-radius: 10px;
      padding: 18px 14px;
      font-weight: 700;
      text-align: center;
      border: 1px solid var(--border);
    }
    .result { margin-top: 10px; display: grid; gap: 6px; }
    .badge {
      display: inline-block;
      width: fit-content;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .pass { background: #d7f2e2; color: #0c5a34; }
    .fail { background: #f6d9d9; color: #8b2020; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .back { display: inline-block; margin-top: 10px; color: var(--brand-deep-green); font-weight: 700; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 950px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Fargepalett-verktøy</h1>
    <div class="layout">
      <section class="panel">
        <div>
          <label for="baseColor">Basisfarge</label>
          <input id="baseColor" type="color" value="#009d4f" />
        </div>

        <div class="row">
          <div>
            <label for="fgColor">Tekstfarge (kontrast)</label>
            <input id="fgColor" type="color" value="#ffffff" />
          </div>
          <div>
            <label for="bgColor">Bakgrunnsfarge (kontrast)</label>
            <input id="bgColor" type="color" value="#009d4f" />
          </div>
        </div>

        <div class="contrast-preview" id="contrastPreview">Eksempeltekst Aa</div>

        <div class="result" id="contrastResult"></div>

        <button id="copyBtn" type="button">Kopier hex-koder</button>
        <p class="meta" id="meta"></p>
        <a class="back" href="../../app/index.html">Tilbake til hovedmeny</a>
      </section>

      <section class="preview">
        <section class="block">
          <h2>Nyanser (lysere → mørkere)</h2>
          <div class="swatches" id="shadeSwatches"></div>
        </section>
        <section class="block">
          <h2>Beslektede farger</h2>
          <div class="swatches" id="relatedSwatches"></div>
        </section>
      </section>
    </div>
  </main>

  <script>
    const baseColorEl = document.getElementById("baseColor");
    const fgColorEl = document.getElementById("fgColor");
    const bgColorEl = document.getElementById("bgColor");
    const contrastPreview = document.getElementById("contrastPreview");
    const contrastResult = document.getElementById("contrastResult");
    const shadeSwatches = document.getElementById("shadeSwatches");
    const relatedSwatches = document.getElementById("relatedSwatches");
    const copyBtn = document.getElementById("copyBtn");
    const metaEl = document.getElementById("meta");

    function hexToRgb(hex) {
      const normalized = hex.replace("#", "");
      const full = normalized.length === 3
        ? normalized.split("").map((v) => v + v).join("")
        : normalized;
      const num = parseInt(full, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToHex({ r, g, b }) {
      const toHex = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function rgbToHsl({ r, g, b }) {
      const rn = r / 255, gn = g / 255, bn = b / 255;
      const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
      let h = 0, s = 0;
      const l = (max + min) / 2;
      const d = max - min;
      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        switch (max) {
          case rn: h = ((gn - bn) / d) % 6; break;
          case gn: h = (bn - rn) / d + 2; break;
          default: h = (rn - gn) / d + 4;
        }
        h *= 60;
        if (h < 0) h += 360;
      }
      return { h, s, l };
    }

    function hslToRgb({ h, s, l }) {
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let rp = 0, gp = 0, bp = 0;
      if (h < 60) { rp = c; gp = x; }
      else if (h < 120) { rp = x; gp = c; }
      else if (h < 180) { gp = c; bp = x; }
      else if (h < 240) { gp = x; bp = c; }
      else if (h < 300) { rp = x; bp = c; }
      else { rp = c; bp = x; }
      return { r: (rp + m) * 255, g: (gp + m) * 255, b: (bp + m) * 255 };
    }

    function relativeLuminance({ r, g, b }) {
      const channel = (v) => {
        const c = v / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      };
      return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
    }

    function contrastRatio(hexA, hexB) {
      const lumA = relativeLuminance(hexToRgb(hexA));
      const lumB = relativeLuminance(hexToRgb(hexB));
      const lighter = Math.max(lumA, lumB);
      const darker = Math.min(lumA, lumB);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function makeSwatchButton(hex, label) {
      const btn = document.createElement("button");
      btn.className = "swatch";
      btn.type = "button";
      btn.title = "Klikk for å kopiere";
      btn.innerHTML = `<span class="fill" style="background:${hex}"></span><span class="label">${label}<br>${hex}</span>`;
      btn.addEventListener("click", () => {
        navigator.clipboard.writeText(hex).then(() => {
          metaEl.textContent = `Kopiert ${hex} til utklippstavlen.`;
        });
      });
      return btn;
    }

    function renderShades() {
      shadeSwatches.innerHTML = "";
      const hsl = rgbToHsl(hexToRgb(baseColorEl.value));
      const steps = [0.9, 0.75, 0.6, 0.45, 0.3, 0.15, 0.05];
      steps.forEach((lightness) => {
        const hex = rgbToHex(hslToRgb({ h: hsl.h, s: hsl.s, l: lightness }));
        shadeSwatches.appendChild(makeSwatchButton(hex, `L ${Math.round(lightness * 100)}%`));
      });
    }

    function renderRelated() {
      relatedSwatches.innerHTML = "";
      const hsl = rgbToHsl(hexToRgb(baseColorEl.value));
      const relations = [
        { label: "Basis", offset: 0 },
        { label: "Komplementær", offset: 180 },
        { label: "Analog +30°", offset: 30 },
        { label: "Analog -30°", offset: -30 },
        { label: "Triade +120°", offset: 120 },
        { label: "Triade -120°", offset: -120 }
      ];
      relations.forEach(({ label, offset }) => {
        let h = (hsl.h + offset) % 360;
        if (h < 0) h += 360;
        const hex = rgbToHex(hslToRgb({ h, s: hsl.s, l: hsl.l }));
        relatedSwatches.appendChild(makeSwatchButton(hex, label));
      });
    }

    function renderContrast() {
      contrastPreview.style.color = fgColorEl.value;
      contrastPreview.style.background = bgColorEl.value;

      const ratio = contrastRatio(fgColorEl.value, bgColorEl.value);
      const ratioText = ratio.toFixed(2);

      const badge = (pass, text) => `<span class="badge ${pass ? "pass" : "fail"}">${text}</span>`;

      contrastResult.innerHTML = `
        <strong>Kontrastforhold: ${ratioText} : 1</strong>
        <div>${badge(ratio >= 4.5, "AA normal tekst")} ${badge(ratio >= 7, "AAA normal tekst")}</div>
        <div>${badge(ratio >= 3, "AA stor tekst")} ${badge(ratio >= 4.5, "AAA stor tekst")}</div>
      `;
    }

    function renderAll() {
      renderShades();
      renderRelated();
      renderContrast();
    }

    copyBtn.addEventListener("click", () => {
      const hex = baseColorEl.value;
      navigator.clipboard.writeText(hex).then(() => {
        metaEl.textContent = `Kopiert ${hex} til utklippstavlen.`;
      });
    });

    baseColorEl.addEventListener("input", renderAll);
    fgColorEl.addEventListener("input", renderContrast);
    bgColorEl.addEventListener("input", renderContrast);

    renderAll();
  </script>
</body>
</html>
