<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plakatgenerator</title>
  <style>
    :root {
      --brand-green: #009d4f;
      --brand-deep-green: #005850;
      --brand-light: #cfd2d3;
      --surface: rgba(255, 255, 255, 0.94);
      --text: #12332f;
      --muted: #385552;
      --border: #afbbbb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Calibri, sans-serif;
      color: var(--text);
      background: linear-gradient(140deg, #edf6f1, #cfd2d3);
      padding: 20px;
    }
    .wrap { width: min(1200px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 12px; }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 16px; }
    .panel, .preview {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .panel { display: grid; gap: 10px; align-content: start; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type="text"], textarea, select, button, input[type="color"] {
      width: 100%;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { cursor: pointer; font-weight: 700; }
    #renderBtn { background: var(--brand-green); color: #fff; border-color: transparent; }
    #downloadBtn { background: var(--brand-deep-green); color: #fff; border-color: transparent; }
    canvas {
      width: min(100%, 760px);
      height: auto;
      border: 1px dashed #7da49e;
      border-radius: 10px;
      background: #fff;
      display: block;
      margin: 0 auto;
    }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .back { display: inline-block; margin-top: 10px; color: var(--brand-deep-green); font-weight: 700; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 950px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Plakatgenerator</h1>
    <div class="layout">
      <section class="panel">
        <div>
          <label for="format">Format</label>
          <select id="format">
            <option value="1080x1920">Skjerm stående 1080 x 1920</option>
            <option value="1920x1080">Skjerm liggende 1920 x 1080</option>
            <option value="1240x1754">A4 stående</option>
            <option value="1754x2480">A3 stående</option>
          </select>
        </div>
        <div>
          <label for="title">Tittel</label>
          <input id="title" type="text" value="Viktig informasjon" />
        </div>
        <div>
          <label for="subtitle">Undertittel</label>
          <input id="subtitle" type="text" value="Oppdatert melding til ansatte" />
        </div>
        <div>
          <label for="body">Hovedtekst</label>
          <textarea id="body">Skriv inn hovedinnhold her. Teksten brytes automatisk over flere linjer.</textarea>
        </div>
        <div>
          <label for="contact">Kontaktlinje</label>
          <input id="contact" type="text" value="Spørsmål: post@eksempel.no" />
        </div>
        <div class="row">
          <div>
            <label for="bg">Bakgrunn</label>
            <input id="bg" type="color" value="#ffffff" />
          </div>
          <div>
            <label for="accent">Aksent</label>
            <input id="accent" type="color" value="#009d4f" />
          </div>
        </div>
        <div class="btns">
          <button id="renderBtn" type="button">Oppdater</button>
          <button id="downloadBtn" type="button">Last ned PNG</button>
        </div>
        <p class="meta" id="meta"></p>
        <a class="back" href="../innhold/index.html">Tilbake til innholdsmeny</a>
      </section>
      <section class="preview">
        <canvas id="posterCanvas" width="1080" height="1920"></canvas>
      </section>
    </div>
  </main>
  <script>
    const formatEl = document.getElementById("format");
    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const bodyEl = document.getElementById("body");
    const contactEl = document.getElementById("contact");
    const bgEl = document.getElementById("bg");
    const accentEl = document.getElementById("accent");
    const renderBtn = document.getElementById("renderBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const canvas = document.getElementById("posterCanvas");
    const metaEl = document.getElementById("meta");
    const ctx = canvas.getContext("2d");

    function wrapText(text, maxWidth, fontSize, lineHeight, x, y, color) {
      ctx.font = `${fontSize}px Segoe UI`;
      ctx.fillStyle = color;
      const words = text.split(/\s+/);
      let line = "";
      let currentY = y;
      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (ctx.measureText(candidate).width > maxWidth && line) {
          ctx.fillText(line, x, currentY);
          line = word;
          currentY += lineHeight;
        } else {
          line = candidate;
        }
      }
      if (line) {
        ctx.fillText(line, x, currentY);
        currentY += lineHeight;
      }
      return currentY;
    }

    function renderPoster() {
      const [w, h] = formatEl.value.split("x").map((v) => Number.parseInt(v, 10));
      canvas.width = w;
      canvas.height = h;

      const margin = Math.round(w * 0.08);
      const headerH = Math.round(h * 0.13);

      ctx.fillStyle = bgEl.value;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = accentEl.value;
      ctx.fillRect(0, 0, w, headerH);

      ctx.fillStyle = "#ffffff";
      ctx.font = `700 ${Math.round(w * 0.055)}px Segoe UI`;
      ctx.fillText("INFORMASJON", margin, Math.round(headerH * 0.62));

      const textColor = "#12332f";
      let y = headerH + Math.round(h * 0.08);
      y = wrapText(titleEl.value.trim() || "", w - margin * 2, Math.round(w * 0.06), Math.round(w * 0.075), margin, y, textColor);
      y += Math.round(h * 0.015);
      y = wrapText(subtitleEl.value.trim() || "", w - margin * 2, Math.round(w * 0.035), Math.round(w * 0.05), margin, y, "#35514d");
      y += Math.round(h * 0.02);
      y = wrapText(bodyEl.value.trim() || "", w - margin * 2, Math.round(w * 0.03), Math.round(w * 0.045), margin, y, textColor);

      const footerH = Math.round(h * 0.1);
      ctx.fillStyle = "#cfd2d3";
      ctx.fillRect(0, h - footerH, w, footerH);
      ctx.fillStyle = "#12332f";
      ctx.font = `600 ${Math.round(w * 0.026)}px Segoe UI`;
      ctx.fillText(contactEl.value.trim() || "", margin, h - Math.round(footerH * 0.42));

      metaEl.textContent = `Format: ${w} x ${h}`;
    }

    function downloadPng() {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "plakat.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    renderBtn.addEventListener("click", renderPoster);
    downloadBtn.addEventListener("click", downloadPng);
    [formatEl, titleEl, subtitleEl, bodyEl, contactEl, bgEl, accentEl].forEach((el) => {
      el.addEventListener("input", renderPoster);
    });

    renderPoster();
  </script>
</body>
</html>
